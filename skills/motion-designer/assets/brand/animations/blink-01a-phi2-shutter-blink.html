<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FLUXD Bumper — Blink 01A — Chamfered-Bracket Φ-2 Shutter Blink</title>
  <style>
    :root { --canvas: #F6F3EC; --ink: #111315; --sig: #E04826; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--canvas);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }
    body.light-mode { background: var(--canvas); color: var(--ink); }
    .stage { width: 52vw; max-width: 680px; display: flex; align-items: center; justify-content: center; position: relative; min-height: 260px; }
    .stage svg { width: 100%; height: auto; max-height: 240px; }
    .controls {
      position: fixed; bottom: 20px; right: 20px; display: flex; gap: 8px; opacity: 0.35; transition: opacity 0.2s;
    }
    .controls:hover { opacity: 1; }
    button {
      background: rgba(255,255,255,0.12); color: inherit; border: 1px solid currentColor; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 12px;
    }
    
@keyframes cleanBinaryBlink {
  0%, 10%, 20%, 30% { opacity: 0; }
  5%, 15%, 25% { opacity: 1; }
  35% { opacity: 1; color: var(--sig); }
  42% { opacity: 0; }
  48%, 100% { opacity: 1; }
}
.anim-target { animation: cleanBinaryBlink 2.2s steps(1, end) infinite; }

  </style>
</head>
<body>
  <div class="stage" id="stage"><div class="anim-target" style="max-width:240px;width:100%;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Left Optical Arc (Octagonal-chamfered precision ring for 100/100 angle audit & crispness) -->
  <path class="mark-body" fill="currentColor" d="M 100 48 L 72 48 L 32 88 L 32 168 L 72 208 L 100 208 L 100 176 L 84 176 L 64 156 L 64 100 L 84 80 L 100 80 Z"/>
  <!-- Central Vertical Flux Bar -->
  <rect class="mark-accent" x="114" y="16" width="28" height="224" fill="var(--sig, currentColor)"/>
  <!-- Right Optical Arc -->
  <path class="mark-body" fill="currentColor" d="M 156 48 L 184 48 L 224 88 L 224 168 L 184 208 L 156 208 L 156 176 L 172 176 L 192 156 L 192 100 L 172 80 L 156 80 Z"/>
</svg></div></div>
  <div class="controls">
    <button onclick="replay()">↻ Replay</button>
    <button onclick="document.body.classList.toggle('light-mode')">◐ Toggle Dark/Light</button>
  </div>
  <script>
    function replay() {
      const s = document.getElementById('stage');
      const html = s.innerHTML;
      s.innerHTML = '';
      void s.offsetWidth;
      s.innerHTML = html;
    }
  </script>
</body>
</html>
